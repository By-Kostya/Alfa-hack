<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ручной прогон</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --paper: #fafaf9;
      --card: #ffffff;
      --red: #ef3124;
      --red-dark: #c4211a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    form {
      display: grid;
      gap: 14px;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .grid {
      display: grid;
      gap: 14px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    label.field {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    select, input[type="number"], textarea {
      width: 100%;
      font: 16px/1.3 inherit;
      color: var(--ink);
      padding: 10px 12px;
      border: 1px solid #d6d3d1;
      border-radius: 10px;
      background: #fff;
    }
    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.45;
    }
    .flags {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
    }
    .flags label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      color: var(--ink);
    }
    .flags label.locked {
      color: var(--muted);
    }
    button {
      font: 16px/1 inherit;
      font-weight: 650;
      color: #fff;
      background: var(--red);
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
    }
    button:hover { background: var(--red-dark); }
    button:disabled {
      background: #a8a29e;
      cursor: not-allowed;
    }
    #status, #error {
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
    }
    #status { background: #f5f5f4; color: var(--muted); }
    #error { background: #fef2f2; color: #991b1b; }
    #results {
      gap: 12px;
      margin-top: 16px;
    }
    #results:not([hidden]) {
      display: grid;
    }
    @media (min-width: 800px) {
      #results:not([hidden]) { grid-template-columns: 1.5fr 0.75fr 0.75fr; }
    }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      min-width: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      letter-spacing: 0.01em;
    }
    dl { margin: 0; }
    dt {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    dd {
      margin: 2px 0 0;
      overflow-wrap: anywhere;
    }
    dd.quote { white-space: pre-wrap; }
    .figure {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .meta {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ручной прогон</h1>
    <form id="form">
      <label class="field">Подставить готовый план
        <select id="plan">
          <option value="">свой текст</option>
          <option value="01_кафе">01_кафе</option>
          <option value="02_it_разработка">02_it_разработка</option>
          <option value="03_автомойка">03_автомойка</option>
          <option value="04_доставка">04_доставка</option>
          <option value="05_найди_собаку">05_найди_собаку</option>
          <option value="06_барахолка">06_барахолка</option>
          <option value="07_одежда_китай">07_одежда_китай</option>
        </select>
      </label>
      <label class="field">Бизнес-план
        <textarea id="plan-text" placeholder="Напишите или вставьте план"></textarea>
      </label>
      <div class="grid">
        <label class="field">Сумма, руб.
          <input id="amount" type="number" min="1" step="1" value="800000" required>
        </label>
        <label class="field">Срок, месяцы
          <input id="term" type="number" min="1" max="360" step="1" value="12" required>
        </label>
        <label class="field">Рейтинг
          <select id="rating">
            <option value="50">50</option>
            <option value="280">280</option>
            <option value="500" selected>500</option>
            <option value="750">750</option>
            <option value="930">930</option>
          </select>
        </label>
        <label class="field">Свои деньги, руб.
          <input id="own" type="number" min="0" step="1" placeholder="пусто, если не указаны">
        </label>
      </div>
      <div class="flags">
        <label id="income-label"><input id="income" type="checkbox"> доход подтверждён</label>
        <label id="capital-label"><input id="capital" type="checkbox"> капитал подтверждён</label>
      </div>
      <button id="run" type="submit">Прогнать</button>
    </form>
    <p id="status" hidden>Считаем…</p>
    <p id="error" hidden></p>
    <section id="results" hidden>
      <article>
        <h2>Отчёт энкодера</h2>
        <dl id="report"></dl>
      </article>
      <article>
        <h2>Платёж</h2>
        <p class="figure" id="payment"></p>
        <p class="meta">monthly_payment_rub</p>
      </article>
      <article>
        <h2>Лимит</h2>
        <p class="figure" id="limit"></p>
        <p class="meta" id="limit-name">limit_rub. Класс модели: 0, 300 000, 800 000 или 2 000 000</p>
      </article>
    </section>
  </main>
  <script>
    const form = document.querySelector("#form");
    const button = document.querySelector("#run");
    const plan = document.querySelector("#plan");
    const planText = document.querySelector("#plan-text");
    const own = document.querySelector("#own");
    const income = document.querySelector("#income");
    const capital = document.querySelector("#capital");
    const incomeLabel = document.querySelector("#income-label");
    const capitalLabel = document.querySelector("#capital-label");
    const status = document.querySelector("#status");
    const error = document.querySelector("#error");
    const results = document.querySelector("#results");
    const report = document.querySelector("#report");
    const payment = document.querySelector("#payment");
    const limit = document.querySelector("#limit");
    const limitName = document.querySelector("#limit-name");

    function rub(value) {
      return new Intl.NumberFormat("ru-RU").format(value) + " \u20bd";
    }

    function syncFlags() {
      const empty = own.value.trim() === "";
      income.disabled = empty;
      capital.disabled = empty;
      incomeLabel.classList.toggle("locked", empty);
      capitalLabel.classList.toggle("locked", empty);
      if (empty) {
        income.checked = false;
        capital.checked = false;
      }
    }

    own.addEventListener("input", syncFlags);
    syncFlags();

    plan.addEventListener("change", async () => {
      if (!plan.value) return;
      planText.value = "";
      try {
        const response = await fetch("/plan?name=" + encodeURIComponent(plan.value));
        const data = await response.json();
        if (!response.ok || data.error) {
          showError(data.error || "План не прочитался.");
          return;
        }
        planText.value = data.plan_text || "";
        error.hidden = true;
      } catch (err) {
        showError("Сервер не ответил.");
      }
    });

    function showError(message) {
      error.hidden = false;
      error.textContent = message;
      results.hidden = true;
    }

    function fillReport(data) {
      report.replaceChildren();
      const rows = [
        ["inferred_monthly_flow_rub", rub(data.inferred_monthly_flow_rub)],
        ["flow_basis", String(data.flow_basis ?? "")],
        ["risks", Array.isArray(data.risks) ? data.risks.join(", ") : ""],
        ["quote", String(data.quote ?? "")],
      ];
      for (const [name, value] of rows) {
        const dt = document.createElement("dt");
        dt.textContent = name;
        const dd = document.createElement("dd");
        dd.textContent = value;
        if (name === "quote") dd.className = "quote";
        report.append(dt, dd);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      status.hidden = false;
      error.hidden = true;
      results.hidden = true;
      const text = planText.value.trim();
      if (!text) {
        showError("Напишите бизнес-план.");
        button.disabled = false;
        status.hidden = true;
        return;
      }
      const empty = own.value.trim() === "";
      const body = {
        plan_text: text,
        loan_amount_rub: Number(document.querySelector("#amount").value),
        loan_term_months: Number(document.querySelector("#term").value),
        credit_rating: Number(document.querySelector("#rating").value),
        own_funds_rub: empty ? null : Number(own.value),
        income_confirmed: empty ? false : income.checked,
        capital_confirmed: empty ? false : capital.checked,
      };
      try {
        const response = await fetch("/score", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        if (!response.ok || data.error) {
          showError(data.error || "Ошибка прогона.");
          return;
        }
        fillReport(data.report);
        payment.textContent = rub(data.monthly_payment_rub);
        limit.textContent = rub(data.limit_rub);
        limitName.textContent = data.limit_rub === 0 ? "limit_rub, отказ" : "limit_rub";
        results.hidden = false;
      } catch (err) {
        showError("Сервер не ответил.");
      } finally {
        status.hidden = true;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
