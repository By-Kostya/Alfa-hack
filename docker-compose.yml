name: alfa-credit

services:
  credit-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
      POSTGRES_DB: ${POSTGRES_DB:-credit}
    volumes:
      - credit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qwen:
    build: ./ML
    environment:
      QWEN_THREADS: ${QWEN_THREADS:-4}
    volumes:
      - qwen-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  backend:
    build: ./backend
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-credit-cabinet}
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@credit-db:5432/${POSTGRES_DB:-credit}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADVISOR_LLM_URL: ${ADVISOR_LLM_URL:-http://qwen:8766/paraphrase}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      credit-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qwen:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  credit-db-data:
  qwen-models:
